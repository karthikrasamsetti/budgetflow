services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: budgetflow
      POSTGRES_DB: budgetflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://budgetflow:budgetflow@db:5432/budgetflow
      JWT_SECRET: dev-only-not-secret
      DEFAULT_AI_PROVIDER: groq
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    # Apply migrations, then start the API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn budgetflow.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
