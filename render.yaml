# Render blueprint. In Render: New > Blueprint, point at this repo.
# Uses an EXTERNAL Postgres (e.g. Neon) — Render free tier allows only one free
# database, so we bring our own. Set DATABASE_URL in the dashboard.
services:
  - type: web
    name: budgetflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # Run migrations, then start the server. $PORT is provided by Render.
    dockerCommand: sh -c "alembic upgrade head && uvicorn budgetflow.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # set in the Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. ["https://budgetflow.vercel.app"]