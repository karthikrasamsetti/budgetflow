[project]
name = "budgetflow"
version = "0.1.0"
description = "Full-stack personal budget planner with an AI assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<0.116",
    "starlette>=0.37,<0.42",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "email-validator>=2.1",
    "python-dateutil>=2.9",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budgetflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic migration scripts are generated; don't lint their formatting.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",    # FastAPI uses function calls in argument defaults (Depends)
    "UP047",   # PEP 695 generic syntax is optional; keep TypeVar style
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
